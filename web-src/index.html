<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a4a; font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #fff; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; letter-spacing: .04em; text-align: center; padding: 24px; }
#status.error { color: #ffb4a8; }
#hud { position: fixed; left: 20px; top: 16px; pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 12px rgba(0,0,0,.35); }
#size { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
#count { font-size: 16px; margin-top: 6px; opacity: .9; }
#help { position: fixed; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 15px; pointer-events: none; text-shadow: 0 1px 0 rgba(0,0,0,.6), 0 0 10px rgba(0,0,0,.5); transition: opacity 1.5s; }
#help.gone { opacity: 0; }
#build { position: fixed; left: 0; right: 0; bottom: 60px; text-align: center; font-size: 15px; line-height: 1.6; white-space: pre-line; pointer-events: none; text-shadow: 0 1px 0 rgba(0,0,0,.7), 0 0 10px rgba(0,0,0,.6); }
#flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 140px 40px rgba(255, 70, 50, .75); }
#flash.on { animation: hit .6s ease-out; }
@keyframes hit { from { opacity: 1; } to { opacity: 0; } }
#help b { display: inline-block; padding: 1px 7px; margin: 0 2px; border: 1px solid rgba(255,255,255,.7); border-radius: 5px; font-weight: 600; background: rgba(0,0,0,.25); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">Loading the world…</div>
<div id="hud" hidden>
  <div id="size"></div>
  <div id="count"></div>
</div>
<div id="help"><b>W</b><b>S</b> roll &nbsp; <b>A</b><b>D</b> turn &nbsp; <b>Shift</b> dash &nbsp; drag mouse to look &nbsp; <b>R</b> put the ball back &nbsp; <b>B</b> build mode</div>
<div id="build" hidden></div>
<div id="flash"></div>
<script>

// way it faces (yaw, in radians). The easy way to get lines for this list: play, press B for build mode,
// place things with F, then press C and paste what it copied over the list below.
// ---------------------------------------------------------------------------------------------------------
window.MAP_ADDITIONS = [
  // { id: 123, x: 14200, y: 95, z: 7600, yaw: 0 },
];
</script>
<script>/*BUNDLE*/</script>
</body>
</html>
